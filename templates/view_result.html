<!DOCTYPE html>
<html>
<head>

<title>Result Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2>
📊 {{ assessment_title }}
</h2>

<hr>

<table class="table table-striped">

<thead>

<tr>
<th>Student</th>
<th>Score</th>
<th>Percentage</th>
</tr>

</thead>

<tbody>

{% for r in results %}

<tr>

<td>{{ r[0] }}</td>

<td>{{ r[1] }}/{{ r[2] }}</td>

<td>{{ "%.1f"|format(r[3]) }}%</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>
</html>
