<!DOCTYPE html>
<html>
<head>
    <title>Assessment Created</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg,#4f46e5,#06b6d4);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .success-card{
            background:white;
            border-radius:25px;
            padding:40px;
            width:700px;
            box-shadow:0 10px 40px rgba(0,0,0,0.25);
            text-align:center;
        }

        .success-icon{
            font-size:80px;
        }

        .code-box{
            background:#eef2ff;
            padding:20px;
            border-radius:15px;
            margin:20px 0;
        }

        .assessment-code{
            font-size:35px;
            font-weight:bold;
            color:#4f46e5;
            letter-spacing:3px;
        }

    </style>

</head>

<body>

<div class="success-card">

    <div class="success-icon">
        ✅
    </div>

    <h1 class="mt-3">
        Assessment Created Successfully
    </h1>

    <p class="text-muted">
        Share this code with students to access the assessment.
    </p>

    <div class="code-box">

        <h5>Assessment Code</h5>

        <div class="assessment-code">
            {{ assessment_code }}
        </div>

    </div>

    <div class="row mt-4">

        <div class="col-md-6">

            <div class="card p-3">
                <h5>📚 Title</h5>
                <p>{{ title }}</p>
            </div>

        </div>

        <div class="col-md-6">

            <div class="card p-3">
                <h5>📖 Topic</h5>
                <p>{{ topic }}</p>
            </div>

        </div>

    </div>

    <div class="row mt-3">

        <div class="col-md-6">

            <div class="card p-3">
                <h5>❓ Questions</h5>
                <p>{{ questions }}</p>
            </div>

        </div>

        <div class="col-md-6">

            <div class="card p-3">
                <h5>⏱ Duration</h5>
                <p>{{ duration }} Minutes</p>
            </div>

        </div>

    </div>

    <a href="/admin_dashboard"
       class="btn btn-primary mt-4">
       Back To Dashboard
    </a>

</div>

</body>
</html>
