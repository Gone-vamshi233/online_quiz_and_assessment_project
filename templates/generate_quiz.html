<!DOCTYPE html>

<html>
<head>
    <title>AI Quiz Generator</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        background: linear-gradient(135deg,#4f46e5,#06b6d4);
        min-height:100vh;
    }

    .quiz-card{
        max-width:700px;
        margin:auto;
        margin-top:80px;
        background:white;
        border-radius:25px;
        padding:40px;
    }

    .icon{
        font-size:70px;
    }

    .btn-custom{
        background:#4f46e5;
        color:white;
        font-size:18px;
        padding:12px;
        border-radius:12px;
    }

    .btn-custom:hover{
        background:#3730a3;
        color:white;
    }

</style>
```

</head>

<body>

<div class="container">

```
<div class="quiz-card shadow-lg">

    <div class="text-center">

        <div class="icon">
            🤖
        </div>

        <h1 class="mt-3">
            AI Quiz Generator
        </h1>

        <p class="text-muted">
            Generate AI-powered MCQs on any topic instantly.
        </p>

    </div>

    <hr>

    <form method="POST" action="/generate_quiz">

        <label class="form-label">
            Enter Topic
        </label>

        <input
            type="text"
            name="topic"
            class="form-control form-control-lg mb-4"
            placeholder="Example: Python, Java, DBMS, Aptitude"
            required>
        <input
type="number"
name="num_questions"
class="form-control mb-3"
placeholder="Number of Questions"
required>

        <button
            type="submit"
            class="btn btn-custom w-100">

            🚀 Generate Questions

        </button>


    </form>

    <div class="mt-4">

        <h5>Popular Topics</h5>

        <span class="badge bg-primary">Python</span>
        <span class="badge bg-success">Java</span>
        <span class="badge bg-warning text-dark">DBMS</span>
        <span class="badge bg-danger">Aptitude</span>
        <span class="badge bg-info text-dark">AI</span>

    </div>

</div>
```

</div>

</body>
</html>
