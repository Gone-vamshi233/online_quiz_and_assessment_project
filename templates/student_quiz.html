<!DOCTYPE html>

<html>
<head>

```
<title>AI Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        background:linear-gradient(135deg,#4f46e5,#06b6d4);
        min-height:100vh;
    }

    .quiz-card{
        background:white;
        border-radius:20px;
        padding:30px;
    }

</style>
```

</head>

<body>

<div class="container mt-5">

```
<div class="quiz-card shadow-lg">

    <h1 class="text-center mb-4">
        🤖 AI Generated Quiz
    </h1>

    <form method="POST" action="/submit_ai_quiz">

        {% for q in questions %}

        <div class="card mb-4 p-3">

            <h5>
                {{ loop.index }}.
                {{ q.question }}
            </h5>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="q{{ loop.index }}"
                       value="A"
                       required>

                <label class="form-check-label">
                    A. {{ q.option_a }}
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="q{{ loop.index }}"
                       value="B">

                <label class="form-check-label">
                    B. {{ q.option_b }}
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="q{{ loop.index }}"
                       value="C">

                <label class="form-check-label">
                    C. {{ q.option_c }}
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="radio"
                       name="q{{ loop.index }}"
                       value="D">

                <label class="form-check-label">
                    D. {{ q.option_d }}
                </label>
            </div>

            <input type="hidden"
                   name="answer{{ loop.index }}"
                   value="{{ q.answer }}">

        </div>

        {% endfor %}

        <input type="hidden"
               name="total_questions"
               value="{{ questions|length }}">

        <button class="btn btn-success w-100">
            Submit Quiz
        </button>

    </form>

</div>
```

</div>

</body>
</html>
