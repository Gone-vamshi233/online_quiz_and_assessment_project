<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

<style>

body{
    background: linear-gradient(135deg,#4f46e5,#06b6d4);
    min-height:100vh;
    color:white;
}

.hero{
    padding-top:100px;
    text-align:center;
}

.btn-custom{
    padding:12px 30px;
    margin:10px;
    border-radius:30px;
    font-size:18px;
}

.feature-card{
    background:white;
    color:black;
    border-radius:20px;
    padding:20px;
    margin:15px;
    text-align:center;
    box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

</style>

</head>

<body>

<div class="container">

    <div class="hero">

        <h1 class="display-3 fw-bold">
            Online Quiz & Assessment Platform
        </h1>

        <p class="lead">
            Learn • Practice • Compete • Improve
        </p>

        <a href="/student_login"
           class="btn btn-light btn-custom">
           Student Login
        </a>

        <a href="/admin_login"
           class="btn btn-warning btn-custom">
           Admin Login
        </a>

        <br>

        <a href="/register"
           class="btn btn-success btn-custom">
           Create Account
        </a>

    </div>

    <div class="row mt-5">

        <div class="col-md-4">
            <div class="feature-card">
                <h4>🤖 AI Quizzes</h4>
                <p>Generate questions using AI instantly.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="feature-card">
                <h4>⏱ Timed Tests</h4>
                <p>Real exam experience with timer.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="feature-card">
                <h4>🏆 Leaderboard</h4>
                <p>Compete with other students.</p>
            </div>
        </div>

    </div>

</div>

</body>
</html>
