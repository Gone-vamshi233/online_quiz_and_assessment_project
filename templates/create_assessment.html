<!DOCTYPE html>
<html>
<head>
    <title>Create Assessment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg,#4f46e5,#06b6d4);
            min-height:100vh;
        }

        .card{
            border:none;
            border-radius:20px;
        }

        .heading{
            color:#4f46e5;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="card shadow-lg p-5 mx-auto" style="max-width:800px;">

        <h1 class="heading text-center mb-4">
            📝 Create Assessment
        </h1>

        <form method="POST">

            <label class="form-label">
                Assessment Title
            </label>

            <input
                type="text"
                name="title"
                class="form-control mb-3"
                placeholder="Ex:Python,java,react"
                required>

            <label class="form-label">
                Topic
            </label>

            <input
                type="text"
                name="topic"
                class="form-control mb-3"
                required>

            <label class="form-label">
                Difficulty
            </label>

            <select
                name="difficulty"
                class="form-control mb-3">

                <option>Easy</option>
                <option>Medium</option>
                <option>Hard</option>

            </select>

            <label class="form-label">
                Number of Questions
            </label>

            <input
                type="number"
                name="questions"
                class="form-control mb-3"
                min="1"
                max="50"
                required>

            <label class="form-label">
                Duration (Minutes)
            </label>

            <input
                type="number"
                name="duration"
                class="form-control mb-4"
                min="1"
                required>

            <button
                type="submit"
                class="btn btn-primary w-100">

                🤖 Generate AI Questions

            </button>

        </form>

    </div>

</div>

</body>
</html>
